name: Deploy Web Panel Admin ke GitHub Pages
on:
  push:
    branches: [main]
    paths: ['apps/web-admin/**', 'apps/mobile/**', 'apps/landing/**', 'tools/tests/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: apps/web-admin/package-lock.json }

      - name: Check landing auth redirects
        run: node --test tools/tests/landing-auth-redirect.test.cjs

      # Panel admin (Vite)
      - run: npm ci
        working-directory: apps/web-admin
      - run: npm run build
        working-directory: apps/web-admin
        env:
          VITE_BASE: /nusakarya/app/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://idlhsxamdkipnmyvewbp.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_-9Cai7RVFQ4UmQjTgjNS8w_Q84U-vc8' }}
      - run: cp dist/index.html dist/404.html
        working-directory: apps/web-admin

      # Aplikasi Teknisi (Expo web / PWA) — dipasang lewat "Tambahkan ke layar utama" di Chrome Android
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run export:web
        working-directory: apps/mobile
      # Susun situs: landing page di akar, panel admin di /app/, aplikasi teknisi di /teknisi/
      - run: |
          mkdir -p _site/app _site/teknisi
          cp -r apps/web-admin/dist/. _site/app/
          cp -r apps/mobile/dist/. _site/teknisi/
          cp apps/landing/index.html _site/index.html
          cp apps/landing/index.html _site/404.html
          node -e "require('fs').writeFileSync('_site/release.json', JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,track:'commercial-pilot',builtAt:new Date().toISOString()}))"

      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
