name: Deploy Web Panel Admin ke GitHub Pages
on:
  push:
    branches: [main]
    paths: ['apps/web-admin/**', 'apps/mobile/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: apps/web-admin/package-lock.json }

      # Panel admin (Vite)
      - run: npm ci
        working-directory: apps/web-admin
      - run: npm run build
        working-directory: apps/web-admin
        env:
          VITE_BASE: /nusakarya/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: cp dist/index.html dist/404.html
        working-directory: apps/web-admin

      # Aplikasi Teknisi (Expo web / PWA) — dipasang lewat "Tambahkan ke layar utama" di Chrome Android
      - run: npm install
        working-directory: apps/mobile
      - run: npm run export:web
        working-directory: apps/mobile
      - run: |
          mkdir -p ../web-admin/dist/teknisi
          cp -r dist/. ../web-admin/dist/teknisi/
        working-directory: apps/mobile

      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web-admin/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
