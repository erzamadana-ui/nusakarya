name: Deploy Web Panel Admin ke GitHub Pages
on:
  push:
    branches: [main]
    paths: ['apps/web-admin/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web-admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: apps/web-admin/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /nusakarya/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://idlhsxamdkipnmyvewbp.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_-9Cai7RVFQ4UmQjTgjNS8w_Q84U-vc8' }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web-admin/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
